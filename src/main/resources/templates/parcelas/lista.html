<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listas de Parcelas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            --color1: #14171C;
            --color2: #222831;
            --color3: #D49A6A;
            --color4: #B8794F;
            --color5: #F1F1EF;
            --color6: #A0A6AF;
            --color7: #DC3545;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--color1);
            color: var(--color5);
        }

        header {
            background-color: var(--color2);
        }

        .logo {
            color: var(--color3);
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo:hover {
            color: var(--color4);
        }

        .logo svg {
            width: 40px;
            height: 40px;
        }

        .nav {
            text-decoration: none;
            color: var(--color5);
            font-size: 1rem;
        }

        .nav:hover {
            color: var(--color3);
        }

        .btn {
            background-color: var(--color3);
            color: var(--color1);
            border: none;
            cursor: pointer;
        }


        .btn:hover {
            background-color: var(--color4);
        }

        .delete {
            background-color: var(--color7);
            color: var(--color5);
            border: 1px solid rgb(255 255 255 / 0);
        }

        .delete:hover {
            background-color: #a82a35;
            border: 1px solid var(--color7);
            color: rgb(255 255 255 / 0.53);
        }


        .card {
            background-color: var(--color2);
            border: 1px solid var(--color6);
        }
        .card-title {
            color: var(--color3);
        }

        section {
            background-color: var(--color2);
        }

        .table th {
            color: var(--color3);
        }

        .table td {
            color: var(--color5);
        }


        footer {
            background-color: var(--color2);
        }
        footer p {
            color: var(--color6);
        }

    </style>
</head>
<body class="mx-auto container-xl" >


<!--  start  header-->
<header class="h-25 d-block d-md-flex justify-content-between align-items-center p-3">

    <a th:href="@{/parcelas}" class="logo d-flex align-items-center text-decoration-none">
        <svg class="me-2" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
             viewBox="0 0 16 16">
            <path d="M8.27 8.074c.893 0 1.419-.545 1.419-1.488s-.526-1.482-1.42-1.482H6.778v2.97z"></path>
            <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm3.5 4.002h2.962C10.045 4.002 11 5.104 11 6.586c0 1.494-.967 2.578-2.55 2.578H6.784V12H5.5z"></path>
        </svg>
        <span>Parcelas</span>
    </a>

    <ul class="d-flex flex-column d-md-flex mt-3 mt-md-0 align-items-md-center list-unstyled mb-0">
        <li><a th:href="@{/parcelas}" class="nav">Parcelas</a></li>
    </ul>

</header>
<!--  end  header-->


<section class="mt-4 p-3">

    <!--    start  card -->
    <div class="py-3 card-body d-flex justify-content-between align-items-center">
        <h2 class="card-title">Lista de Parcelas</h2>

        <a th:href="@{/parcelas/nueva}" class="btn btn-primary d-flex justify-content-center align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-square" viewBox="0 0 16 16">
                <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
            </svg>
            <span class="ms-2">Nueva parcela</span>
        </a>
    </div>
    <!--    end  card -->



    <!--    start   empty -->
    <article th:if="${#lists.isEmpty(parcelas)}" class="card my-3">

        <div class="card-body">
            <p class="card-title text-center">No hay parcelas</p>
        </div>

    </article>
    <!--    end   empty -->


    <!--    start   lista de parcelas -->
    <table th:unless="${#lists.isEmpty(parcelas)}" class="table table-dark table-striped my-3">
        <tr>
            <th>Nombre</th>
            <th>Ubicación</th>
            <th>Superficie</th>
            <th>Tipo</th>
            <th></th>
        </tr>

        <tr th:each="parcela : ${parcelas}">

            <td >
                <a class="nav" th:href="@{/parcelas/{id}(id=${parcela?.id})}" th:text="${parcela.nombre}"></a>

            </td>

            <td th:text="${parcela.ubicacion}"></td>

            <td th:text="${parcela.superficie}"></td>

            <td th:text="${parcela.tipoCultivo?.etiqueta}"></td>

            <td>

                <form th:action="@{/parcelas/{id}/eliminar(id=${parcela?.id})}" method="post"
                      onsubmit="return confirm('¿Seguro que quieres eliminar esta parcela?');">
                    <button class="btn delete btn-sm btn-danger"  type="submit">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                            <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
                        </svg>
                    </button>
                </form>

            </td>

        </tr>
    </table>
    <!--    end   lista de parcelas -->
</section>




<!--  start  footer-->
<footer class="h-25 mt-4">
    <p class="text-center p-3">© 2026 - Diseñado por Mohamed Y Hugo</p>
</footer>
<!--  end  footer-->



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

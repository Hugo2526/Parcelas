<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<style>
    :root {
        --color1: #14171C;
        --color2: #222831;
        --color3: #D49A6A;
        --color4: #B8794F;
        --color5: #F1F1EF;
        --color6: #A0A6AF;
        --color7: #DC3545;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--color1);
        color: var(--color5);
    }

    header {
        background-color: var(--color2);
    }

    .logo {
        color: var(--color3);
        font-size: 1.5rem;
        font-weight: bold;
    }

    .logo:hover {
        color: var(--color4);
    }

    .logo svg {
        width: 40px;
        height: 40px;
    }

    .nav {
        text-decoration: none;
        color: var(--color5);
        font-size: 1rem;
    }

    .nav:hover {
        color: var(--color3);
    }

    .btn {
        background-color: var(--color3);
        color: var(--color1);
        border: none;
        cursor: pointer;
    }


    .btn:hover {
        background-color: var(--color4);
    }

    .delete {
        background-color: var(--color7);
        color: var(--color5);
        border: 1px solid rgb(255 255 255 / 0);
    }

    .delete:hover {
        background-color: #a82a35;
        border: 1px solid var(--color7);
        color: rgb(255 255 255 / 0.53);
    }


    .card {
        background-color: var(--color2);
        border: 1px solid var(--color3);
    }
    .card-title {
        color: var(--color3);
    }

    section {
        background-color: var(--color2);
    }

    .table th {
        color: var(--color3);
    }

    .table td {
        color: var(--color5);
    }


    footer {
        background-color: var(--color2);
    }
    footer p {
        color: var(--color6);
    }

    .superficie , .table {
        background-color: var(--color2);
        border: 1px solid var(--color3)!important;
        padding: 1rem;
    }

    .superficie {
        border-radius: 4px;
    }

    .superficie h2 {
        color: var(--color3);
        font-size: 1.5rem;
    }

    .superficie .icon svg {
        color: var(--color3);
        width: 50px;
        height: 50px;
    }

    .superficie span {
        color: var(--color6);
        font-size: 0.9rem;
    }


</style>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">

        <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-2">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb"><li class="breadcrumb-item active">Panel</li></ol>
                </nav>
                <h1>Panel general</h1>
            </div>
            <span class="text-secondary small">
        <i class="bi bi-clock me-1"></i>Actualizado:
        <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}">09/11/2026 19:40</span>
      </span>
        </div>

        <div class="row g-3">

            <section class="mt-4 p-3">

                <div class="my-3 w-100 superficie">
                    <div class="p-2">
                        <div class="d-flex justify-content-between">
                            <div>
                                <span>Superficie Total</span>
                                <h2 class="fs-3" th:text="${superficieTotal+ ' Ha'}"></h2>
                            </div>
                            <div class="icon">
                                <svg xmlns="http://www.w3.org/2000/svg"  fill="currentColor" class="bi bi-clipboard-plus-fill" viewBox="0 0 16 16">
                                    <path d="M6.5 0A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0zm3 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5z"/>
                                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1A2.5 2.5 0 0 1 9.5 5h-3A2.5 2.5 0 0 1 4 2.5zm4.5 6V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5a.5.5 0 0 1 1 0"/>
                                </svg>
                            </div>
                        </div>

                    </div>
                </div>


                <div class="my-3 w-100 d-flex align-items-md-center justify-content-md-between flex-column flex-md-row">
                    <div class="p-2">

                        <!--       start Filtrar por cultivo-->
                        <div class="mb-3 d-flex align-items-md-center justify-md-content-between flex-column flex-md-row w-100 w-md-auto">

                            <span>Filtrar por cultivo:</span>

                            <a th:href="@{/parcelas}" class="mx-md-2 btn btn-dark btn-sm my-2 my-md-0">Todo</a>

                            <a th:each="tipo : ${tipos}"
                               th:href="@{/parcelas/cultivo/{tipo}(tipo=${tipo})}"
                               th:text="${tipo.etiqueta}"
                               class="mx-md-2 btn btn-dark btn-sm my-2 my-md-0">

                            </a>
                        </div>
                        <!--   end Filtrar por cultivo-->
                    </div>


                    <!--       start Ordenado por nombre-->
                    <div class="mb-3 p-2">

                        <a th:href="@{/parcelas/asc}" class="btn btn-dark btn-sm me-2 w-100">Ordenado por nombre</a>

                    </div>
                    <!--       end Ordenado por nombre-->
                </div>

                <!--    start  card -->
                <div class="py-3 card-body d-flex justify-content-between align-items-center">
                    <h2 class="card-title">Lista de Parcelas</h2>

                    <a th:href="@{/parcelas/nueva}" class="btn btn-dark d-flex justify-content-center align-items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-square" viewBox="0 0 16 16">
                            <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                            <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                        </svg>
                        <span class="ms-2">Nueva parcela</span>
                    </a>
                </div>
                <!--    end  card -->



                <!--    start   empty -->
                <article th:if="${#lists.isEmpty(parcelas)}" class="card my-3">

                    <div class="card-body">
                        <p class="card-title text-center">No hay parcelas</p>
                    </div>

                </article>
                <!--    end   empty -->


                <!--    start   lista de parcelas -->
                <table th:unless="${#lists.isEmpty(parcelas)}" class="table table-dark table-striped my-3">
                    <tr>
                        <th>Nombre</th>
                        <th>Ubicación</th>
                        <th>Superficie</th>
                        <th>Tipo</th>
                        <th></th>
                    </tr>

                    <tr th:each="parcela : ${parcelas}">

                        <td >
                            <a class="nav" th:href="@{/parcelas/{id}(id=${parcela?.id})}" th:text="${parcela.nombre}"></a>

                        </td>

                        <td th:text="${parcela.ubicacion}"></td>

                        <td th:text="${parcela.superficie}"></td>

                        <td th:text="${parcela.tipoCultivo?.etiqueta}"></td>

                        <td class=" d-flex justify-content-center align-items-center">

                            <form th:action="@{/parcelas/{id}/eliminar(id=${parcela?.id})}" method="post"
                                  onsubmit="return confirm('¿Seguro que quieres eliminar esta parcela?');">
                                <button class="btn delete btn-sm btn-danger"  type="submit">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                                        <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
                                    </svg>
                                </button>
                            </form>


                            <!-- start link editar -->
                            <a th:href="@{/parcelas/{id}/editar(id=${parcela.id})}" class="btn btn-sm btn-dark mx-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z"/>
                                </svg>

                            </a>
                            <!-- end link editar -->
                        </td>

                    </tr>
                </table>
                <!--    end   lista de parcelas -->
            </section>


        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

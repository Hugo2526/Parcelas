<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<style>
    :root {
        --color1: #14171C;
        --color2: #222831;
        --color3: #D49A6A;
        --color4: #B8794F;
        --color5: #F1F1EF;
        --color6: #A0A6AF;
        --color7: #DC3545;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: var(--color1);
        color: var(--color5);
    }

    header {
        background-color: var(--color2);
    }

    .logo {
        color: var(--color3);
        font-size: 1.5rem;
        font-weight: bold;
    }

    .logo:hover {
        color: var(--color4);
    }

    .logo svg {
        width: 40px;
        height: 40px;
    }

    .nav {
        text-decoration: none;
        color: var(--color5);
        font-size: 1rem;
    }

    .nav:hover {
        color: var(--color3);
    }

    .btn {
        background-color: var(--color3);
        color: var(--color1);
        border: none;
        cursor: pointer;
    }


    .btn:hover {
        background-color: var(--color4);
    }




    .card-title {
        color: var(--color3);
    }

    section {
        background-color: var(--color2);
    }

    .table th {
        color: var(--color3);
    }

    .table td {
        color: var(--color5);
    }


    footer {
        background-color: var(--color2);
    }
    footer p {
        color: var(--color6);
    }

    .card {
        background-color: var(--color2);
        border: 1px solid var(--color3);
    }




    input,select {
        background-color: var(--color2)!important;
        color: var(--color5)!important;
        border: 1px solid var(--color3)!important;
        border-radius: 4px!important;
        padding: 0.5rem!important;
    }
    input:focus,select:focus {
        outline: none!important;
        border-color: var(--color4)!important;
        box-shadow: 0 0 5px var(--color4)!important;
    }

</style>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">

        <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-2">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb"><li class="breadcrumb-item active">Panel</li></ol>
                </nav>
                <h1>Panel general</h1>
            </div>
            <span class="text-secondary small">
        <i class="bi bi-clock me-1"></i>Actualizado:
        <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}">09/11/2026 19:40</span>
      </span>
        </div>

        <div class="row g-3">
            <section class="p-3 d-flex justify-content-between align-items-center">

                <!-- start link Editar Parcela si hay objeto -->
                <h2 th:if="${parcela.getId() != null}" class="card-title">Editar Parcela</h2>
                <!-- end link Editar Parcela si hay objeto -->

                <!-- start link Editar Parcela si no hay objeto -->
                <h2 th:unless="${parcela.getId() != null}" class="card-title">Nueva Parcela</h2>
                <!-- end link Editar Parcela si no hay objeto -->

                <a  th:href="@{/parcelas}" class="btn btn-secondary">Volver</a>
            </section>




            <form th:action="@{/parcelas}" th:object="${parcela}" th:method="post" class="p-3">

                <input th:if="${parcela.getId() != null}" type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input th:field="*{nombre}" type="text" class="form-control" id="nombre" name="nombre" required>
                </div>

                <div class="mb-3">
                    <label for="ubicacion" class="form-label">Ubicación:</label>
                    <input th:field="*{ubicacion}" type="text" class="form-control" id="ubicacion" name="ubicacion" required>
                </div>

                <div class="mb-3">
                    <label for="superficie" class="form-label">Superficie (ha):</label>
                    <input th:field="*{superficie}" type="number" step="0.01" min="0.01" class="form-control" id="superficie" name="superficie" required>
                </div>

                <div class="mb-3">
                    <label for="tipoCultivo" class="form-label">Tipo de cultivo:</label>
                    <select th:field="*{tipoCultivo}"  class="form-select" id="tipoCultivo" name="tipoCultivo" required>

                        <option value="" selected></option>
                        <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo.etiqueta}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/parcelas}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>

            </form>

        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

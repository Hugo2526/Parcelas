 <!DOCTYPE html>
    <html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Panel')}"></head>

    <style>
        :root {
            --color1: #14171C;
            --color2: #222831;
            --color3: #D49A6A;
            --color4: #B8794F;
            --color5: #F1F1EF;
            --color6: #A0A6AF;
            --color7: #DC3545;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--color1);
            color: var(--color5);
        }

        header {
            background-color: var(--color2);
        }

        .logo {
            color: var(--color3);
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo:hover {
            color: var(--color4);
        }

        .logo svg {
            width: 40px;
            height: 40px;
        }

        .nav {
            text-decoration: none;
            color: var(--color5);
            font-size: 1rem;
        }

        .nav:hover {
            color: var(--color3);
        }

        .btn {
            background-color: var(--color3);
            color: var(--color1);
            border: none;
            cursor: pointer;
        }


        .btn:hover {
            background-color: var(--color4);
        }

        .delete {
            background-color: var(--color7);
            color: var(--color5);
            border: 1px solid rgb(255 255 255 / 0);
        }

        .delete:hover {
            background-color: #a82a35;
            border: 1px solid var(--color7);
            color: rgb(255 255 255 / 0.53);
        }


        .card-title {
            color: var(--color3);
        }

        section {
            background-color: var(--color2);
        }

        .table th {
            color: var(--color3);
        }

        .table td {
            color: var(--color5);
        }


        footer {
            background-color: var(--color2);
        }

        footer p {
            color: var(--color6);
        }

        .card {
            background-color: var(--color2);
            border: 1px solid var(--color3);
        }

        .card-body {
            color: var(--color5);
        }

        .badge {
            background-color: var(--color3);
            color: var(--color1);
        }

    </style>

    <body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="d-flex">
        <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

        <main class="app-main flex-grow-1 p-3 p-lg-4">

            <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-2">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb"><li class="breadcrumb-item active">Panel</li></ol>
                    </nav>
                    <h1>Panel general</h1>
                </div>
                <span class="text-secondary small">
        <i class="bi bi-clock me-1"></i>Actualizado:
        <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}">09/11/2026 19:40</span>
      </span>
            </div>

            <div class="row g-3">
                <section class="p-3 card-body">


                    <h5 class="card-title fs-5" th:text="${parcela.nombre}"></h5>

                    <p class="card-text mt-2">
                        <strong>ID:</strong>
                        <span th:text="${parcela.id}"></span>
                    </p>

                    <p class="card-text mt-2">
                        <strong>Ubicación:</strong>
                        <span th:text="${parcela.ubicacion}"></span>
                    </p>


                    <p class="card-text mt-2">
                        <strong>Superficie:</strong>
                        <span th:text="${parcela.superficie}"></span>
                    </p>


                    <p class="card-text mt-2">
                        <strong>Cultivo:</strong>
                        <span class="badge fs-6" th:text="${parcela.tipoCultivo?.etiqueta}"></span>
                    </p>
                </section>

            </div>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </main>
    </div>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    </body>
    </html>
